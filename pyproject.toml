[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-templeos"
version = "0.1.1"
description = "TempleOS Hermes plugin: a local QEMU guest the agent and user can share."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kyle Durepos" }]
keywords = ["hermes", "templeos", "tinkeros", "temple-of-hermes", "qemu", "plugin"]
dependencies = [
  "pillow>=10,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pyyaml>=6,<7",
  "ruamel.yaml>=0.18,<0.19",
  "tiktoken>=0.7,<1",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/mojomast/hermes-templeos"

[tool.setuptools.packages.find]
include = ["templeos*"]
exclude = ["tests*", "docs*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "smoke: live QEMU plus a pinned ISO (set TEMPLEOS_SMOKE=1)",
]
