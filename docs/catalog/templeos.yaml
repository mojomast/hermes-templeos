  - https://raw.githubusercontent.com/mojomast/hermes-templeos/0000000000000000000000000000000000000000/docs/images/pane-typing.png
  - https://raw.githubusercontent.com/mojomast/hermes-templeos/0000000000000000000000000000000000000000/docs/images/pane-narrow.png
  - https://raw.githubusercontent.com/mojomast/hermes-templeos/0000000000000000000000000000000000000000/docs/images/pane-agent-log.png
  - https://raw.githubusercontent.com/mojomast/hermes-templeos/0000000000000000000000000000000000000000/docs/images/pane-user-driving.png
  - https://raw.githubusercontent.com/mojomast/hermes-templeos/0000000000000000000000000000000000000000/docs/images/pane-onboarding.png
known_issues:
  - "FAT floppy push is experimental; bake-off did not see hot-added FAT12 as A: on TinkerOS live CD."
  - "Primary host is Linux x86_64. Apple Silicon and Windows are untested."
  - "Temple of Hermes 0.1.3 is the default flavor, pinned to the official GitHub release ISO and a preinstalled disk image; TinkerOS, TempleOS 5.03, and ZealOS remain optional. No ISO is bundled."
capabilities:
  provides_tools:
    - templeos_vm
    - templeos_screen
    - templeos_input
    - templeos_files
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - pre_llm_call
    - post_llm_call
    - on_stream_start
    - on_stream_delta
    - on_stream_end
    - api_request_error
    - pre_approval_request
    - post_approval_response
    - on_human_input_request
    - on_human_input_resolved
    - on_session_start
    - on_session_end
    - agent_loop_stopped
    - subagent_start
    - subagent_stop
  provides_middleware: []
  requires_env:
    - TEMPLEOS_CHAT_BRIDGE_TOKEN
